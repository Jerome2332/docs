name: 🤖 Auto-Update Webinar Schedules

on:
  schedule:
    # Run daily at 1:00 AM UTC (2:00 AM BST / 1:00 AM GMT)
    - cron: '0 1 * * *'
  
  # Allow manual triggering for testing and immediate updates
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no commits)'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-webinars:
    name: 🗓️ Update Webinar Dates
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Use a token that can push to protected branches if needed
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📊 Check Current Schedule
        run: |
          echo "📅 Current date: $(date)"
          echo "📋 Current webinar counts:"
          if [ -f "automation/webinar-schedule.json" ]; then
            node -e "
              const schedule = JSON.parse(require('fs').readFileSync('automation/webinar-schedule.json', 'utf8'));
              console.log('  Flipping:', schedule.flipping.length);
              console.log('  Deal Sourcing:', schedule['deal-sourcing'].length);
              console.log('  YPN:', schedule.ypn.length);
              console.log('  Total:', schedule.metadata.total_webinars);
              console.log('  Last Updated:', schedule.metadata.last_updated);
            "
          else
            echo "  ❌ Schedule file not found"
          fi
      
      - name: 🤖 Run Webinar Update Script
        id: update
        run: |
          echo "🚀 Running webinar update script..."
          
          # Make script executable
          chmod +x automation/update-webinars.js
          
          # Run the update script and capture output
          if node automation/update-webinars.js > update_log.txt 2>&1; then
            echo "✅ Update script completed successfully"
            echo "update_success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Update script failed"
            echo "update_success=false" >> $GITHUB_OUTPUT
            cat update_log.txt
            exit 1
          fi
          
          # Show the log
          echo "📋 Update Log:"
          cat update_log.txt
          
          # Check if any files were modified
          if git diff --quiet; then
            echo "✨ No changes detected"
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 Changes detected"
            echo "changes_made=true" >> $GITHUB_OUTPUT
            
            echo "📝 Changed files:"
            git diff --name-only
            
            echo "📊 Summary of changes:"
            git diff --stat
          fi
      
      - name: 📋 Validate Updated Schedule
        if: steps.update.outputs.changes_made == 'true'
        run: |
          echo "🔍 Validating updated schedule..."
          
          # Check if schedule file is valid JSON
          if node -e "JSON.parse(require('fs').readFileSync('automation/webinar-schedule.json', 'utf8'))" 2>/dev/null; then
            echo "✅ Schedule JSON is valid"
          else
            echo "❌ Schedule JSON is invalid"
            exit 1
          fi
          
          # Show updated counts
          echo "📊 Updated webinar counts:"
          node -e "
            const schedule = JSON.parse(require('fs').readFileSync('automation/webinar-schedule.json', 'utf8'));
            console.log('  Flipping:', schedule.flipping.length);
            console.log('  Deal Sourcing:', schedule['deal-sourcing'].length);
            console.log('  YPN:', schedule.ypn.length);
            console.log('  Total:', schedule.metadata.total_webinars);
            console.log('  Last Updated:', schedule.metadata.last_updated);
          "
      
      - name: 💾 Commit Changes
        if: steps.update.outputs.changes_made == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "TGPC Webinar Bot"
          
          # Add all changed files
          git add .
          
          # Create commit message with details
          COMMIT_MSG="🤖 Auto-update: Remove outdated webinars [$(date +'%Y-%m-%d')]"
          
          # Add summary to commit message
          echo "" >> commit_details.txt
          echo "Updated files:" >> commit_details.txt
          git diff --cached --name-only >> commit_details.txt
          echo "" >> commit_details.txt
          echo "Schedule summary:" >> commit_details.txt
          node -e "
            const schedule = JSON.parse(require('fs').readFileSync('automation/webinar-schedule.json', 'utf8'));
            console.log('Total webinars:', schedule.metadata.total_webinars);
            console.log('Flipping:', schedule.flipping.length);
            console.log('Deal Sourcing:', schedule['deal-sourcing'].length);
            console.log('YPN:', schedule.ypn.length);
          " >> commit_details.txt
          
          # Commit with detailed message
          git commit -m "$COMMIT_MSG" -m "$(cat commit_details.txt)"
          
          echo "✅ Changes committed successfully"
      
      - name: 🚀 Push Changes
        if: steps.update.outputs.changes_made == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "📤 Pushing changes to repository..."
          git push origin main
          echo "✅ Changes pushed successfully"
      
      - name: 📊 Summary Report
        if: always()
        run: |
          echo "## 📋 Webinar Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.update.outputs.update_success }}" == "true" ]; then
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.update.outputs.changes_made }}" == "true" ]; then
            echo "**Changes:** 🔄 Files updated" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Updated Files:" >> $GITHUB_STEP_SUMMARY
            git diff HEAD~1 --name-only | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "- No files changed" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Current Schedule:" >> $GITHUB_STEP_SUMMARY
            node -e "
              const schedule = JSON.parse(require('fs').readFileSync('automation/webinar-schedule.json', 'utf8'));
              console.log('- **Total Webinars:** ' + schedule.metadata.total_webinars);
              console.log('- **Flipping:** ' + schedule.flipping.length);
              console.log('- **Deal Sourcing:** ' + schedule['deal-sourcing'].length);
              console.log('- **YPN:** ' + schedule.ypn.length);
              console.log('- **Last Updated:** ' + schedule.metadata.last_updated);
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "**Changes:** ✨ No updates needed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** 🧪 Dry run mode - no changes were committed" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 🚨 Notify on Failure
        if: failure()
        run: |
          echo "❌ Webinar update workflow failed!"
          echo "Please check the logs and fix any issues."
          echo "The webinar schedules may need manual attention."
          
          # Could add Slack/email notification here if needed
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 TGPC Webinar update failed! Check GitHub Actions."}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

# Security: Limit permissions to only what's needed
permissions:
  contents: write  # Needed to push commits
  actions: read    # Needed to read workflow status
